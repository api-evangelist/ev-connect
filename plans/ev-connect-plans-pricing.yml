description: >-
  EV Connect sells its charge-station management platform and API Platform
  through a sales-led, quote-based motion rather than self-service public
  pricing. The API Platform is marketed as being accessible via an API Gateway
  with "documentation and service plans," but the specific service-plan tiers,
  quotas, and prices are not published and require contacting EV Connect /
  Schneider Electric sales. No pricing figures are reconciled in this artifact.
notes: >-
  Pricing is not publicly listed. EV Connect is part of Schneider Electric;
  commercial terms for the platform and API access are negotiated per customer.
  Reconcile service-plan tiers and prices from a partner agreement or quote.
sources:
- https://www.evconnect.com/platform/
- https://www.evconnect.com/quote/
- https://www.se.com/us/en/
