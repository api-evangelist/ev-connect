meters:
- name: platform_agreement
  description: >-
    Negotiated platform / API Platform agreement. Specific metered units (per
    station, per session, per API call) are not publicly documented.
  unit: contract
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: >-
    Request usage and billing detail directly from EV Connect / Schneider
    Electric; no self-service usage export is publicly documented.
- name: Allocation
  description: >-
    Map platform charges to charging sites, networks, or business units per the
    negotiated agreement.
- name: Optimization
  description: >-
    Negotiate service-plan tiers and volume terms with sales; align API Gateway
    plan to actual station/session volume.
- name: Accountability
  description: >-
    Assign an owner for the EV Connect agreement and review platform spend
    against the negotiated contract.
