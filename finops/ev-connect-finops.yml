description: >-
  FinOps view of EV Connect platform and API spend. EV Connect (part of
  Schneider Electric) sells its charge point management platform and API
  Platform through quote-based, sales-led agreements rather than usage-based
  public pricing. Because service-plan tiers, metered units, and prices are not
  published, the billing model and meters below are unreconciled placeholders
  to be confirmed from a partner agreement.
notes: >-
  No public pricing or usage-metering details are available. Reconcile billing
  model, charge categories, and any per-API-call or per-station/per-session
  metering from the EV Connect / Schneider Electric commercial agreement.
sources:
- https://www.evconnect.com/platform/
- https://www.evconnect.com/quote/
