aid: ev-connect
url: https://raw.githubusercontent.com/api-evangelist/ev-connect/refs/heads/main/apis.yml
name: EV Connect
kind: company
description: EV Connect is an EV charging network and charge-station management platform
  (a CPMS / charge point management system) now part of Schneider Electric. Its API
  Platform exposes open, standards-based APIs through an API Gateway so operators can
  white-label driver apps and integrate charging into commerce, loyalty, fleet, and
  energy systems, backed by OCPP station certification and OCPI roaming. Developer
  documentation and credentials are partner/sales-gated; no public base URL, endpoints,
  or authentication details are published.
